[tool.poetry]
name = "ddddocr-project"
version = "0.1.0"
description = "Python OCR project with ddddocr"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "configs"}, {include = "nets"}, {include = "projects"}, {include = "tools"}, {include = "utils"}]

[tool.poetry.dependencies]
python = "^3.8"
fire = "*"
loguru = "*"
pyyaml = "*"
tqdm = "*"
numpy = "<2"
pillow = "9.5.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^5.0.0"
pytest-mock = "^3.14.0"

[tool.poetry.scripts]
test = "pytest:main"
tests = "pytest:main"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--verbose",
    "--cov=configs",
    "--cov=tools",
    "--cov=utils",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests"
]

[tool.coverage.run]
source = ["configs", "tools", "utils"]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/migrations/*",
    "*/.venv/*",
    "*/venv/*",
    "*/nets/*",  # Exclude nets module due to torch dependency
    "*/projects/*",  # Exclude projects module for now
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"